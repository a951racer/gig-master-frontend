<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>" />
    <!-- PWA (#110): theme + iPad standalone / Add-to-Home-Screen support. -->
    <meta name="theme-color" content="#16132a" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 'black' gives the status bar an opaque dark background (vs the
         'black-translucent' overlay, which let the lighter page show through
         at the very top as a gradient band). Pairs with theme-color #16132a. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Gig Master</title>
    <!-- Runtime config (#8): sets window.__APP_CONFIG__ before the app bundle. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
